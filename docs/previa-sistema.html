f=\"/marketplace\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 26 26\" aria-hidden=\"true\">\n    <circle cx=\"13\" cy=\"13\" r=\"5.5\" fill=\"#ffc233\"></circle>\n    <g stroke=\"#ffc233\" stroke-width=\"2\" stroke-linecap=\"round\">\n        <path d=\"M13 1.5v3M13 21.5v3M1.5 13h3M21.5 13h3M4.9 4.9l2.1 2.1M19 19l2.1 2.1M4.9 21.1L7 19M19 7l2.1-2.1\"></path>\n    </g>\n</svg> Marketplace de Energia Solar</a>\n        <span class=\"area\">Área do gerador</span>\n        <div class=\"conta\"><strong>Ana Souza</strong><a href=\"/logout\">Sair</a></div>\n    </div>\n</header>\n<div class=\"gaveta-fundo\" data-fechar-menu=\"\"></div>\n<nav id=\"gaveta\" class=\"gaveta\" aria-label=\"Menu principal\">\n    <div class=\"gaveta-topo\">\n        <span class=\"avatar\" aria-hidden=\"true\">A</span>\n        <div><strong>Ana Souza</strong><span>Área do gerador</span></div>\n        <button type=\"button\" class=\"fechar\" data-fechar-menu=\"\" aria-label=\"Fechar menu\">×</button>\n    </div>\n    <div class=\"gaveta-itens\"><a class=\"gaveta-item\" href=\"/marketplace\">Início</a><details class=\"gaveta-grupo\" open=\"\">\n    <summary>Vendas<svg class=\"seta\" width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M5 3l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></summary>\n    <div class=\"gaveta-sub\"><a class=\"gaveta-item\" href=\"/vendas\">Resumo</a><a class=\"gaveta-item ativo\" href=\"/vendas/ofertas\" aria-current=\"page\">Minhas ofertas</a><a class=\"gaveta-item\" href=\"/vendas/estoque\">Estoque de créditos</a></div>\n</details>\n<details class=\"gaveta-grupo\">\n    <summary>Minha energia<svg class=\"seta\" width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M5 3l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></summary>\n    <div class=\"gaveta-sub\"><a class=\"gaveta-item\" href=\"/unidades\">Unidades consumidoras</a><a class=\"gaveta-item\" href=\"/energia\">Registrar energia</a></div>\n</details>\n<a class=\"gaveta-item\" href=\"/relatorios\">Relatórios</a></div>\n    <a class=\"gaveta-sair\" href=\"/logout\">Sair</a>\n</nav>\n\n<main class=\"conteudo\">\n    <div class=\"area-layout\">\n    <aside class=\"subnav\" aria-label=\"Vendas\">\n        <p class=\"subnav-titulo\">Vendas</p>\n        <nav><a href=\"/vendas\">Resumo</a><a href=\"/vendas/ofertas\" class=\"ativo\" aria-current=\"page\">Minhas ofertas</a><a href=\"/vendas/estoque\">Estoque de créditos</a></nav>\n        <a class=\"botao subnav-acao\" href=\"/vendas/ofertas#nova-oferta\">Anunciar crédito</a>\n    </aside>\n    <div class=\"area-conteudo\">\n        <p class=\"trilha\"><span>Vendas</span><svg class=\"seta\" width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M5 3l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span>Minhas ofertas</span></p>\n        <div class=\"cabecalho-pagina\">\n    <h2>Minhas ofertas</h2>\n    <p>Anuncie o crédito que sobrou da sua geração e acompanhe as suas ofertas. Elas aparecem para os\n    consumidores do mesmo centro de distribuição da unidade geradora.</p>\n</div>\n\n<div class=\"grade-2 lado\" id=\"nova-oferta\">\n    <section class=\"caixa\"><h3>Nova oferta</h3>\n<form method=\"POST\" action=\"/vendas/ofertar\">\n    <label for=\"creditoId\">Crédito a ofertar</label>\n    <select id=\"creditoId\" name=\"creditoId\"><option value=\"1\">UC-1001, crédito #1 (140,00 kWh)</option></select>\n    <p class=\"dica\">A oferta aparece para os consumidores do centro de distribuição da unidade geradora.</p>\n    <div class=\"campos-linha\">\n        <div>\n            <label for=\"quantidade\">Quantidade (kWh)</label>\n            <input type=\"text\" id=\"quantidade\" name=\"quantidade\" inputmode=\"decimal\" placeholder=\"ex: 50\" required=\"\">\n        </div>\n        <div>\n            <label for=\"preco\">Preço por kWh (R$)</label>\n            <input type=\"text\" id=\"preco\" name=\"preco\" inputmode=\"decimal\" placeholder=\"ex: 0,65\" required=\"\">\n        </div>\n    </div>\n    <button type=\"submit\">Publicar oferta</button>\n</form>\n</section>\n    <section class=\"caixa\"><h3>Em estoque</h3><p class=\"apoio\">Ao publicar, os kWh saem do estoque e ficam reservados na oferta.</p><ul class=\"lista-creditos\"><li><div><span class=\"uc\">UC-1001</span><span class=\"validade\">Crédito #1, válido até 11/11/2031</span></div>\n<span class=\"saldo\">140,00 kWh</span></li>\n</ul>\n        <p class=\"dica\"><a href=\"/vendas/estoque\">Ver estoque completo</a></p></section>\n</div>\n<section class=\"secao\">\n    <div class=\"secao-topo\"><div><h3>Ofertas publicadas</h3><p>Edite o preço, cancele ou exclua. Ofertas com vendas não podem ser excluídas, porque as transações são o histórico financeiro de compradores e vendedores: para tirá-las do marketplace, use Cancelar.</p></div></div>\n    <div class=\"tabela-envoltorio\"><table>\n        <thead><tr><th>Oferta</th><th>Situação</th><th class=\"num\">Disponível</th><th class=\"num\">Vendido</th><th>Preço por kWh</th><th></th></tr></thead>\n        <tbody><tr>\n    <td><b>Oferta #1</b><span class=\"secundario\">Centro de Distribuição Maringá Norte</span></td>\n    <td><span class=\"status status-aberta\">Aberta</span></td>\n    <td class=\"num\">75,00 kWh<span class=\"secundario\">de 100,00 ofertados</span></td>\n    <td class=\"num\">25,00 kWh</td>\n    <td><form method=\"POST\" action=\"/vendas/editar\" class=\"form-inline\">\n    <input type=\"hidden\" name=\"ofertaId\" value=\"1\">\n    <input type=\"text\" name=\"preco\" value=\"0,68\" inputmode=\"decimal\" aria-label=\"Novo preço por kWh\" required=\"\">\n    <button type=\"submit\" class=\"botao-secundario pequeno\">Salvar</button>\n</form>\n</td>\n    <td><div class=\"acoes\"><form method=\"POST\" action=\"/vendas/cancelar\" onsubmit=\"return confirm('Cancelar esta oferta? O saldo não vendido volta ao crédito de origem.');\">\n    <input type=\"hidden\" name=\"ofertaId\" value=\"1\">\n    <button type=\"submit\" class=\"botao-secundario pequeno\">Cancelar</button>\n</form>\n<form method=\"POST\" action=\"/vendas/excluir\" onsubmit=\"return confirm('Excluir definitivamente esta oferta?');\">\n    <input type=\"hidden\" name=\"ofertaId\" value=\"1\">\n    <button type=\"submit\" class=\"botao-perigo pequeno\">Excluir</button>\n</form>\n</div></td>\n</tr>\n</tbody>\n    </table></div>\n</section>\n\n\n    </div>\n</div>\n\n</main>\n<footer class=\"rodape\">\n    <p>Projeto acadêmico ODS 9: marketplace de créditos de energia solar excedente (Lei 14.300/2022).</p>\n</footer>\n\n\n\n\n</body></html>"},{"titulo":"Vendas › Estoque","nota":"Cada crédito gerado, com mês de origem, saldo, validade, situação e o atalho Anunciar.","html":"<!DOCTYPE html><html lang=\"pt-BR\"><head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    <title>Estoque de créditos | Marketplace de Energia Solar</title>\n    <style>:root {\n    --noite: #14213d;\n    --painel: #1f4e79;\n    --sol: #ffc233;\n    --sol-escuro: #e0a100;\n    --credito: #1e8a5b;\n    --credito-claro: #e6f4ed;\n    --fundo: #f2f5f9;\n    --superficie: #ffffff;\n    --linha: #d5dee8;\n    --texto: #1b2433;\n    --texto-suave: #5b6778;\n    --perigo: #b42318;\n    --perigo-claro: #fdecea;\n    --raio: 10px;\n    --raio-pequeno: 6px;\n    --sombra: 0 1px 2px rgba(20, 33, 61, 0.06), 0 4px 14px rgba(20, 33, 61, 0.05);\n    --fonte: \"Segoe UI Variable Text\", \"Segoe UI\", system-ui, -apple-system, \"Helvetica Neue\", Arial, sans-serif;\n    --acento: var(--sol);\n    --acento-hover: var(--sol-escuro);\n    --acento-texto: var(--noite);\n    --acento-claro: #fff4d1;\n    --acento-vivo: var(--sol);\n}\n\nbody.perfil-consumidor {\n    --acento: #2563eb;\n    --acento-hover: #1d4ed8;\n    --acento-texto: #ffffff;\n    --acento-claro: #e3ecfd;\n    --acento-vivo: #7fb2ff;\n}\n\nbody.perfil-ambos {\n    --acento: #15803d;\n    --acento-hover: #116632;\n    --acento-texto: #ffffff;\n    --acento-claro: #e2f4e8;\n    --acento-vivo: #5ee08c;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n    margin: 0;\n    min-height: 100vh;\n    display: flex;\n    flex-direction: column;\n    font-family: var(--fonte);\n    font-size: 15px;\n    line-height: 1.5;\n    color: var(--texto);\n    background: var(--fundo);\n}\n\na { color: var(--painel); text-underline-offset: 2px; }\na:hover { color: var(--noite); }\n\n:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }\n\nh1, h2, h3 { line-height: 1.25; margin: 0; color: var(--noite); }\nh2 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }\nh3 { font-size: 1.08rem; font-weight: 650; }\np { margin: 0; }\n\n.barra {\n    background: var(--noite);\n    color: #fff;\n    border-top: 4px solid var(--acento-vivo);\n}\n\n.barra-interna {\n    max-width: 1160px;\n    margin: 0 auto;\n    padding: 0 24px;\n    min-height: 60px;\n    display: flex;\n    align-items: center;\n    gap: 14px;\n}\n\n.hamburguer {\n    height: 38px;\n    padding: 0 12px 0 8px;\n    gap: 6px;\n    color: #fff;\n    background: transparent;\n    border: 1px solid #3b4a69;\n    font-size: 0.88rem;\n}\n.hamburguer:hover { background: #1d2c4d; border-color: #6a7a99; color: #fff; }\n\n.marca {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    color: #fff;\n    text-decoration: none;\n    font-weight: 700;\n    font-size: 1.02rem;\n    white-space: nowrap;\n}\n.marca:hover { color: #fff; }\n.marca svg { flex: none; }\n\n.area {\n    font-size: 0.72rem;\n    font-weight: 700;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--acento-vivo);\n    border: 1px solid currentColor;\n    border-radius: 999px;\n    padding: 2px 10px;\n    white-space: nowrap;\n}\n\n.conta {\n    display: flex;\n    align-items: center;\n    margin-left: auto;\n    gap: 12px;\n    font-size: 0.85rem;\n    white-space: nowrap;\n}\n.conta strong { color: #fff; font-weight: 600; }\n.conta a { color: #fff; font-weight: 600; text-decoration: none; padding: 6px 12px; border: 1px solid #3b4a69; border-radius: var(--raio-pequeno); }\n.conta a:hover { border-color: #fff; color: #fff; }\n\n.gaveta-fundo {\n    position: fixed;\n    inset: 0;\n    background: rgba(10, 18, 36, 0.45);\n    opacity: 0;\n    visibility: hidden;\n    transition: opacity 0.2s, visibility 0.2s;\n    z-index: 40;\n}\n.gaveta {\n    position: fixed;\n    top: 0;\n    left: 0;\n    bottom: 0;\n    width: min(320px, 86vw);\n    background: var(--superficie);\n    box-shadow: 4px 0 24px rgba(10, 18, 36, 0.18);\n    transform: translateX(-100%);\n    visibility: hidden;\n    transition: transform 0.22s ease, visibility 0.22s;\n    z-index: 50;\n    display: flex;\n    flex-direction: column;\n    overflow-y: auto;\n}\nbody.gaveta-aberta .gaveta { transform: none; visibility: visible; }\nbody.gaveta-aberta .gaveta-fundo { opacity: 1; visibility: visible; }\n\n.gaveta-topo {\n    display: grid;\n    grid-template-columns: 44px minmax(0, 1fr) auto;\n    gap: 12px;\n    align-items: center;\n    padding: 18px 16px 18px 20px;\n    background: var(--noite);\n    color: #fff;\n    border-top: 4px solid var(--acento-vivo);\n}\n.gaveta-topo strong { display: block; font-size: 0.98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.gaveta-topo span:not(.avatar) { display: block; font-size: 0.78rem; color: var(--acento-vivo); font-weight: 600; }\n.avatar {\n    width: 44px; height: 44px; border-radius: 50%;\n    display: inline-flex; align-items: center; justify-content: center;\n    background: var(--acento); color: var(--acento-texto);\n    font-weight: 700; font idor {\n    --acento: #2563eb;\n    --acento-hover: #1d4ed8;\n    --acento-texto: #ffffff;\n    --acento-claro: #e3ecfd;\n    --acento-vivo: #7fb2ff;\n}\n\nbody.perfil-ambos {\n    --acento: #15803d;\n    --acento-hover: #116632;\n    --acento-texto: #ffffff;\n    --acento-claro: #e2f4e8;\n    --acento-vivo: #5ee08c;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n    margin: 0;\n    min-height: 100vh;\n    display: flex;\n    flex-direction: column;\n    font-family: var(--fonte);\n    font-size: 15px;\n    line-height: 1.5;\n    color: var(--texto);\n    background: var(--fundo);\n}\n\na { color: var(--painel); text-underline-offset: 2px; }\na:hover { color: var(--noite); }\n\n:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }\n\nh1, h2, h3 { line-height: 1.25; margin: 0; color: var(--noite); }\nh2 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }\nh3 { font-size: 1.08rem; font-weight: 650; }\np { margin: 0; }\n\n.barra {\n    background: var(--noite);\n    color: #fff;\n    border-top: 4px solid var(--acento-vivo);\n}\n\n.barra-interna {\n    max-width: 1160px;\n    margin: 0 auto;\n    padding: 0 24px;\n    min-height: 60px;\n    display: flex;\n    align-items: center;\n    gap: 14px;\n}\n\n.hamburguer {\n    height: 38px;\n    padding: 0 12px 0 8px;\n    gap: 6px;\n    color: #fff;\n    background: transparent;\n    border: 1px solid #3b4a69;\n    font-size: 0.88rem;\n}\n.hamburguer:hover { background: #1d2c4d; border-color: #6a7a99; color: #fff; }\n\n.marca {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    color: #fff;\n    text-decoration: none;\n    font-weight: 700;\n    font-size: 1.02rem;\n    white-space: nowrap;\n}\n.marca:hover { color: #fff; }\n.marca svg { flex: none; }\n\n.area {\n    font-size: 0.72rem;\n    font-weight: 700;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--acento-vivo);\n    border: 1px solid currentColor;\n    border-radius: 999px;\n    padding: 2px 10px;\n    white-space: nowrap;\n}\n\n.conta {\n    display: flex;\n    align-items: center;\n    margin-left: auto;\n    gap: 12px;\n    font-size: 0.85rem;\n    white-space: nowrap;\n}\n.conta strong { color: #fff; font-weight: 600; }\n.conta a { color: #fff; font-weight: 600; text-decoration: none; padding: 6px 12px; border: 1px solid #3b4a69; border-radius: var(--raio-pequeno); }\n.conta a:hover { border-color: #fff; color: #fff; }\n\n.gaveta-fundo {\n    position: fixed;\n    inset: 0;\n    background: rgba(10, 18, 36, 0.45);\n    opacity: 0;\n    visibility: hidden;\n    transition: opacity 0.2s, visibility 0.2s;\n    z-index: 40;\n}\n.gaveta {\n    position: fixed;\n    top: 0;\n    left: 0;\n    bottom: 0;\n    width: min(320px, 86vw);\n    background: var(--superficie);\n    box-shadow: 4px 0 24px rgba(10, 18, 36, 0.18);\n    transform: translateX(-100%);\n    visibility: hidden;\n    transition: transform 0.22s ease, visibility 0.22s;\n    z-index: 50;\n    display: flex;\n    flex-direction: column;\n    overflow-y: auto;\n}\nbody.gaveta-aberta .gaveta { transform: none; visibility: visible; }\nbody.gaveta-aberta .gaveta-fundo { opacity: 1; visibility: visible; }\n\n.gaveta-topo {\n    display: grid;\n    grid-template-columns: 44px minmax(0, 1fr) auto;\n    gap: 12px;\n    align-items: center;\n    padding: 18px 16px 18px 20px;\n    background: var(--noite);\n    color: #fff;\n    border-top: 4px solid var(--acento-vivo);\n}\n.gaveta-topo strong { display: block; font-size: 0.98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.gaveta-topo span:not(.avatar) { display: block; font-size: 0.78rem; color: var(--acento-vivo); font-weight: 600; }\n.avatar {\n    width: 44px; height: 44px; border-radius: 50%;\n    display: inline-flex; align-items: center; justify-content: center;\n    background: var(--acento); color: var(--acento-texto);\n    font-weight: 700; font-s r\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></summary>\n    <div class=\"gaveta-sub\"><a class=\"gaveta-item\" href=\"/unidades\">Unidades consumidoras</a><a class=\"gaveta-item\" href=\"/energia\">Registrar energia</a></div>\n</details>\n<a class=\"gaveta-item\" href=\"/relatorios\">Relatórios</a></div>\n    <a class=\"gaveta-sair\" href=\"/logout\">Sair</a>\n</nav>\n\n<main class=\"conteudo\">\n    <div class=\"area-layout\">\n    <aside class=\"subnav\" aria-label=\"Vendas\">\n        <p class=\"subnav-titulo\">Vendas</p>\n        <nav><a href=\"/vendas\">Resumo</a><a href=\"/vendas/ofertas\" class=\"ativo\" aria-current=\"page\">Minhas ofertas</a><a href=\"/vendas/estoque\">Estoque de créditos</a></nav>\n        <a class=\"botao subnav-acao\" href=\"/vendas/ofertas#nova-oferta\">Anunciar crédito</a>\n    </aside>\n    <div class=\"area-conteudo\">\n        <p class=\"trilha\"><span>Vendas</span><svg class=\"seta\" width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M5 3l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span>Minhas ofertas</span></p>\n        <div class=\"cabecalho-pagina\">\n    <h2>Minhas ofertas</h2>\n    <p>Anuncie o crédito que sobrou da sua geração e acompanhe as suas ofertas. Elas aparecem para os\n    consumidores do mesmo centro de distribuição da unidade geradora.</p>\n</div>\n<div class=\"alerta alerta-erro\">A oferta não pode ser excluída: possui 1 venda registrada. O histórico de transações é um registro financeiro e precisa ser preservado. Para tirá-la do marketplace, use Cancelar.</div>\n<div class=\"grade-2 lado\" id=\"nova-oferta\">\n    <section class=\"caixa\"><h3>Nova oferta</h3>\n<form method=\"POST\" action=\"/vendas/ofertar\">\n    <label for=\"creditoId\">Crédito a ofertar</label>\n    <select id=\"creditoId\" name=\"creditoId\"><option value=\"1\">UC-1001, crédito #1 (140,00 kWh)</option></select>\n    <p class=\"dica\">A oferta aparece para os consumidores do centro de distribuição da unidade geradora.</p>\n    <div class=\"campos-linha\">\n        <div>\n            <label for=\"quantidade\">Quantidade (kWh)</label>\n            <input type=\"text\" id=\"quantidade\" name=\"quantidade\" inputmode=\"decimal\" placeholder=\"ex: 50\" required=\"\">\n        </div>\n        <div>\n            <label for=\"preco\">Preço por kWh (R$)</label>\n            <input type=\"text\" id=\"preco\" name=\"preco\" inputmode=\"decimal\" placeholder=\"ex: 0,65\" required=\"\">\n        </div>\n    </div>\n    <button type=\"submit\">Publicar oferta</button>\n</form>\n</section>\n    <section class=\"caixa\"><h3>Em estoque</h3><p class=\"apoio\">Ao publicar, os kWh saem do estoque e ficam reservados na oferta.</p><ul class=\"lista-creditos\"><li><div><span class=\"uc\">UC-1001</span><span class=\"validade\">Crédito #1, válido até 11/11/2031</span></div>\n<span class=\"saldo\">140,00 kWh</span></li>\n</ul>\n        <p class=\"dica\"><a href=\"/vendas/estoque\">Ver estoque completo</a></p></section>\n</div>\n<section class=\"secao\">\n    <div class=\"secao-topo\"><div><h3>Ofertas publicadas</h3><p>Edite o preço, cancele ou exclua. Ofertas com vendas não podem ser excluídas, porque as transações são o histórico financeiro de compradores e vendedores: para tirá-las do marketplace, use Cancelar.</p></div></div>\n    <div class=\"tabela-envoltorio\"><table>\n        <thead><tr><th>Oferta</th><th>Situação</th><th class=\"num\">Disponível</th><th class=\"num\">Vendido</th><th>Preço por kWh</th><th></th></tr></thead>\n        <tbody><tr>\n    <td><b>Oferta #1</b><span class=\"secundario\">Centro de Distribuição Maringá Norte</span></td>\n    <td><span class=\"status status-aberta\">Aberta</span></td>\n    <td class=\"num\">75,00 kWh<span class=\"secundario\">de 100,00 ofertados</span></td>\n    <td class=\"num\">25,00 kWh</td>\n    <td><form method=\"POST\" action=\"/vendas/editar\" class=\"form-inline\">\n    <input type=\"hidden\" name=\"ofertaId\" value=\"1\">\n    <input type=\"text\" name=\"preco\" value=\"0,68\" inputmode=\"decimal\" aria-label=\"Novo preço por kWh\" required=\"\">\n    <button type=\"submit\" class=\"botao-secundario pequeno\">Salvar</button>\n</form>\n</td>\n    <td><div class=\"acoes\"><form method=\"POST\" action=\"/vendas/cancelar\" onsubmit=\"return confirm('Cancelar esta oferta? O saldo não vendido volta ao crédito de origem.');\">\n    <input type=\"hidden\" name=\"ofertaId\" value=\"1\">\n    <button type=\"submit\" class=\"botao-secundario pequeno\">Cancelar</button>\n</form>\n<form method=\"POST\" action=\"/vendas/excluir\" onsubmit=\"return confirm('Excluir definitivamente esta oferta?');\">\n    <input type=\"hidden\" name=\"ofertaId\" value=\"1\">\n    <button type=\"submit\" class=\"botao-perigo pequeno\">Excluir</button>\n</form>\n</div></td>\n</tr>\n</tbody>\n    </table></div>\n</section>\n\n\n    </div>\n</div>\n\n</main>\n<footer class=\"rodape\">\n    <p>Projeto acadêmico ODS 9: marketplace de créditos de energia solar excedente (Lei 14.300/2022).</p>\n</footer>\n\n\n\n\n</body></html>"},{"titulo":"Minha energia › Unidades","nota":"CRUD de unidades consumidoras.","html":"<!DOCTYPE html><html lang=\"pt-BR\"><head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    <title>Unidades consumidoras | Marketplace de Energia Solar</title>\n    <style>:root {\n    --noite: #14213d;\n    --painel: #1f4e79;\n    --sol: #ffc233;\n    --sol-escuro: #e0a100;\n    --credito: #1e8a5b;\n    --credito-claro: #e6f4ed;\n    --fundo: #f2f5f9;\n    --superficie: #ffffff;\n    --linha: #d5dee8;\n    --texto: #1b2433;\n    --texto-suave: #5b6778;\n    --perigo: #b42318;\n    --perigo-claro: #fdecea;\n    --raio: 10px;\n    --raio-pequeno: 6px;\n    --sombra: 0 1px 2px rgba(20, 33, 61, 0.06), 0 4px 14px rgba(20, 33, 61, 0.05);\n    --fonte: \"Segoe UI Variable Text\", \"Segoe UI\", system-ui, -apple-system, \"Helvetica Neue\", Arial, sans-serif;\n    --acento: var(--sol);\n    --acento-hover: var(--sol-escuro);\n    --acento-texto: var(--noite);\n    --acento-claro: #fff4d1;\n    --acento-vivo: var(--sol);\n}\n\nbody.perfil-consumidor {\n    --acento: #2563eb;\n    --acento-hover: #1d4ed8;\n    --acento-texto: #ffffff;\n    --acento-claro: #e3ecfd;\n    --acento-vivo: #7fb2ff;\n}\n\nbody.perfil-ambos {\n    --acento: #15803d;\n    --acento-hover: #116632;\n    --acento-texto: #ffffff;\n    --acento-claro: #e2f4e8;\n    --acento-vivo: #5ee08c;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n    margin: 0;\n    min-height: 100vh;\n    display: flex;\n    flex-direction: column;\n    font-family: var(--fonte);\n    font-size: 15px;\n    line-height: 1.5;\n    color: var(--texto);\n    background: var(--fundo);\n}\n\na { color: var(--painel); text-underline-offset: 2px; }\na:hover { color: var(--noite); }\n\n:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }\n\nh1, h2, h3 { line-height: 1.25; margin: 0; color: var(--noite); }\nh2 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }\nh3 { font-size: 1.08rem; font-weight: 650; }\np { margin: 0; }\n\n.barra {\n    background: var(--noite);\n    color: #fff;\n    border-top: 4px solid var(--acento-vivo);\n}\n\n.barra-interna {\n    max-width: 1160px;\n    margin: 0 auto;\n    padding: 0 24px;\n    min-height: 60px;\n    display: flex;\n    align-items: center;\n    gap: 14px;\n}\n\n.hamburguer {\n    height: 38px;\n    padding: 0 12px 0 8px;\n    gap: 6px;\n    color: #fff;\n    background: transparent;\n    border: 1px solid #3b4a69;\n    font-size: 0.88rem;\n}\n.hamburguer:hover { background: #1d2c4d; border-color: #6a7a99; color: #fff; }\n\n.marca {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    color: #fff;\n    text-decoration: none;\n    font-weight: 700;\n    font-size: 1.02rem;\n    white-space: nowrap;\n}\n.marca:hover { color: #fff; }\n.marca svg { flex: none; }\n\n.area {\n    font-size: 0.72rem;\n    font-weight: 700;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--acento-vivo);\n    border: 1px solid currentColor;\n    border-radius: 999px;\n    padding: 2px 10px;\n    white-space: nowrap;\n}\n\n.conta {\n    display: flex;\n    align-items: center;\n    margin-left: auto;\n    gap: 12px;\n    font-size: 0.85rem;\n    white-space: nowrap;\n}\n.conta strong { color: #fff; font-weight: 600; }\n.conta a { color: #fff; font-weight: 600; text-decoration: none; padding: 6px 12px; border: 1px solid #3b4a69; border-radius: var(--raio-pequeno); }\n.conta a:hover { border-color: #fff; color: #fff; }\n\n.gaveta-fundo {\n    position: fixed;\n    inset: 0;\n    background: rgba(10, 18, 36, 0.45);\n    opacity: 0;\n    visibility: hidden;\n    transition: opacity 0.2s, visibility 0.2s;\n    z-index: 40;\n}\n.gaveta {\n    position: fixed;\n    top: 0;\n    left: 0;\n    bottom: 0;\n    width: min(320px, 86vw);\n    background: var(--superficie);\n    box-shadow: 4px 0 24px rgba(10, 18, 36, 0.18);\n    transform: translateX(-100%);\n    visibility: hidden;\n    transition: transform 0.22s ease, visibility 0.22s;\n    z-index: 50;\n    display: flex;\n    flex-direction: column;\n    overflow-y: auto;\n}\nbody.gaveta-aberta .gaveta { transform: none; visibility: visible; }\nbody.gaveta-aberta .gaveta-fundo { opacity: 1; visibility: visible; }\n\n.gaveta-topo {\n    display: grid;\n    grid-template-columns: 44px minmax(0, 1fr) auto;\n    gap: 12px;\n    align-items: center;\n    padding: 18px 16px 18px 20px;\n    background: var(--noite);\n    color: #fff;\n    border-top: 4px solid var(--acento-vivo);\n}\n.gaveta-topo strong { display: block; font-size: 0.98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.gaveta-topo span:not(.avatar) { display: block; font-size: 0.78rem; color: var(--acento-vivo); font-weight: 600; }\n.avatar {\n    width: 44px; height: 44px; border-radius: 50%;\n    display: inline-flex; align-items: center; justify-content: center;\n    background: var(--acento); color: var(--acento-texto);\n    font-weight: 700; font-size: 1.1rem;\n}\n.gaveta .fechar {\n    width: 36px; height: 36px; padding: 0;\n    font-size: 1.5rem; line-height: 1;\n    color: #fff; background: transparent; border: 1px solid #3b4a69;\n}\n.gaveta .fechar:hover { background: #1d2c4d; color: #fff; border-color: #6a7a99; }\n\n.gaveta-itens { padding: 10px 0; flex: 1; }\n.gaveta-item, .gaveta-grupo summary {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 12px 20px;\n    color: var(--texto);\n    text-decoration: none;\n    font-weight: 600;\n    font-size: 0.95rem;\n    cursor: pointer;\n    border-left: 4px solid transparent;\n}\n.gaveta-item:hover, .gaveta-grupo summary:hover { background: #f4f7fb; color: var(--noite); }\n.gaveta-item.ativo { border-left-color: var(--acento); background: var(--acento-claro); color: var(--noite); }\n.gaveta-grupo summary { list-style: none; }\n.gaveta-grupo summary::-webkit-details-marker { display: none; }\n.gaveta-grupo .seta { color: var(--texto-suave); transition: transform 0.15s; }\n.gaveta-grupo[open] > summary .seta { transform: rotate(90deg); }\n.gaveta-sub .gaveta-item { padding: 10px 20px 10px 36px; font-weight: 500; font-size: 0.9rem; }\n.gaveta-sair {\n    margin: 0 20px 20px;\n    padding: 12px 0 0;\n    border-top: 1px solid var(--linha);\n    color: var(--perigo);\n    font-weight: 600;\n    text-decoration: none;\n}\n\n.area-layout {\n    display: grid;\n    grid-template-columns: 220px minmax(0, 1fr);\n    gap: 32px;\n    align-items: start;\n}\n.subnav {\n    position: sticky;\n    top: 20px;\n    background: var(--superficie);\n    border: 1px solid var(--linha);\n    border-radius: var(--raio);\n    padding: 16px 0;\n}\n.s ue\">Estoque de créditos</a></div>\n</details>\n<details class=\"gaveta-grupo\" open=\"\">\n    <summary>Minha energia<svg class=\"seta\" width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M5 3l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></summary>\n    <div class=\"gaveta-sub\"><a class=\"gaveta-item ativo\" href=\"/unidades\" aria-current=\"page\">Unidades consumidoras</a><a class=\"gaveta-item\" href=\"/energia\">Registrar energia</a></div>\n</details>\n<a class=\"gaveta-item\" href=\"/relatorios\">Relatórios</a></div>\n    <a class=\"gaveta-sair\" href=\"/logout\">Sair</a>\n</nav>\n\n<main class=\"conteudo\">\n    <div class=\"area-layout\">\n    <aside class=\"subnav\" aria-label=\"Minha energia\">\n        <p class=\"subnav-titulo\">Minha energia</p>\n        <nav><a href=\"/unidades\" class=\"ativo\" aria-current=\"page\">Unidades consumidoras</a><a href=\"/energia\">Registrar energia</a></nav>\n        \n    </aside>\n    <div class=\"area-conteudo\">\n        <p class=\"trilha\"><span>Minha energia</span><svg class=\"seta\" width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M5 3l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span>Unidades consumidoras</span></p>\n        <div class=\"cabecalho-pagina\">\n    <h2>Minhas unidades consumidoras</h2>\n    <p>Cada unidade é um ponto de consumo da distribuidora. É nela que a geração é medida e o crédito é registrado.</p>\n</div>\n\n\n<div class=\"grade-2\">\n    <section><div class=\"tabela-envoltorio\"><table>\n    <thead><tr><th>Unidade</th><th>Centro de distribuição</th><th class=\"num\">Capacidade</th><th></th></tr></thead>\n    <tbody><tr>\n    <td><b>UC-1001</b><span class=\"secundario\">Rua das Palmeiras, 120 - Maringá/PR</span></td>\n    <td>Centro de Distribuição Maringá Norte</td>\n    <td class=\"num\">5,40 kWp</td>\n    <td><div class=\"acoes\">\n        <a class=\"botao botao-secundario pequeno\" href=\"/unidades/editar?id=1\">Editar</a>\n        <form method=\"POST\" action=\"/unidades/excluir\" onsubmit=\"return confirm('Excluir esta unidade? Os lançamentos de energia e os créditos dela também serão removidos.');\">\n            <input type=\"hidden\" name=\"id\" value=\"1\">\n            <button type=\"submit\" class=\"botao-perigo pequeno\">Excluir</button>\n        </form>\n    </div></td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"dica\">Uma unidade com ofertas publicadas no marketplace só pode ser excluída depois que essas ofertas forem excluídas.\nSe alguma oferta já teve vendas, a unidade fica preservada como histórico financeiro.</p>\n</section>\n    <section class=\"caixa\">\n        <h3>Cadastrar unidade</h3>\n        <form method=\"POST\" action=\"/unidades\">\n            <label for=\"numeroUc\">Número da UC</label>\n<input type=\"text\" id=\"numeroUc\" name=\"numeroUc\" value=\"\" placeholder=\"ex: UC-1001\" required=\"\" minlength=\"3\" maxlength=\"30\">\n<label for=\"endereco\">Endereço</label>\n<input type=\"text\" id=\"endereco\" name=\"endereco\" value=\"\" placeholder=\"Rua, número, cidade\" required=\"\" minlength=\"5\" maxlength=\"200\">\n<label for=\"centroId\">Centro de distribuição</label>\n<select id=\"centroId\" name=\"centroId\"><option value=\"1\">Centro de Distribuição Maringá Norte (Maringá/PR)</option><option value=\"2\">Centro de Distribuição Sarandi (Sarandi/PR)</option></select>\n<label for=\"capacidade\">Capacidade de geração instalada (kWp)</label>\n<input type=\"text\" id=\"capacidade\" name=\"capacidade\" value=\"\" inputmode=\"decimal\" placeholder=\"ex: 5,4\">\n<p class=\"dica\">Deixe 0 se a unidade não tiver painéis solares.</p>\n\n            <button type=\"submit\">Cadastrar unidade</button>\n        </form>\n    </section>\n</div>\n\n    </div>\n</div>\n\n</main>\n<footer class=\"rodape\">\n    <p>Projeto acadêmico ODS 9: marketplace de créditos de energia solar excedente (Lei 14.300/2022).</p>\n</footer>\n\n\n\n\n</body></html>"},{"titulo":"Editar unidade","nota":"Update: formulário preenchido com os dados atuais da unidade.","html":"<!DOCTYPE html><html lang=\"pt-BR\"><head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    <title>Editar unidade | Marketplace de Energia Solar</title>\n    <style>:root {\n    --noite: #14213d;\n    --painel: #1f4e79;\n    --sol: #ffc233;\n    --sol-escuro: #e0a100;\n    --credito: #1e8a5b;\n    --credito-claro: #e6f4ed;\n    --fundo: #f2f5f9;\n    --superficie: #ffffff;\n    --linha: #d5dee8;\n    --texto: #1b2433;\n    --texto-suave: #5b6778;\n    --perigo: #b42318;\n    --perigo-claro: #fdecea;\n    --raio: 10px;\n    --raio-pequeno: 6px;\n    --sombra: 0 1px 2px rgba(20, 33, 61, 0.06), 0 4px 14px rgba(20, 33, 61, 0.05);\n    --fonte: \"Segoe UI Variable Text\", \"Segoe UI\", system-ui, -apple-system, \"Helvetica Neue\", Arial, sans-serif;\n    --acento: var(--sol);\n    --acento-hover: var(--sol-escuro);\n    --acento-texto: var(--noite);\n    --acento-claro: #fff4d1;\n    --acento-vivo: var(--sol);\n}\n\nbody.perfil-consumidor {\n    --acento: #2563eb;\n    --acento-hover: #1d4ed8;\n    --acento-texto: #ffffff;\n    --acento-claro: #e3ecfd;\n    --acento-vivo: #7fb2ff;\n}\n\nbody.perfil-ambos {\n    --acento: #15803d;\n    --acento-hover: #116632;\n    --acento-texto: #ffffff;\n    --acento-claro: #e2f4e8;\n    --acento-vivo: #5ee08c;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n    margin: 0;\n    min-height: 100vh;\n    display: flex;\n    flex-direction: column;\n    font-family: var(--fonte);\n    font-size: 15px;\n    line-height: 1.5;\n    color: var(--texto);\n    background: var(--fundo);\n}\n\na { color: var(--painel); text-underline-offset: 2px; }\na:hover { color: var(--noite); }\n\n:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }\n\nh1, h2, h3 { line-height: 1.25; margin: 0; color: var(--noite); }\nh2 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }\nh3 { font-size: 1.08rem; font-weight: 650; }\np { margin: 0; }\n\n.barra {\n    background: var(--noite);\n    color: #fff;\n    border-top: 4px solid var(--acento-vivo);\n}\n\n.barra-interna {\n    max-width: 1160px;\n    margin: 0 auto;\n    padding: 0 24px;\n    min-height: 60px;\n    display: flex;\n    align-items: center;\n    gap: 14px;\n}\n\n.hamburguer {\n    height: 38px;\n    padding: 0 12px 0 8px;\n    gap: 6px;\n    color: #fff;\n    background: transparent;\n    border: 1px solid #3b4a69;\n    font-size: 0.88rem;\n}\n.hamburguer:hover { background: #1d2c4d; border-color: #6a7a99; color: #fff; }\n\n.marca {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    color: #fff;\n    text-decoration: none;\n    font-weight: 700;\n    font-size: 1.02rem;\n    white-space: nowrap;\n}\n.marca:hover { color: #fff; }\n.marca svg { flex: none; }\n\n.area {\n    font-size: 0.72rem;\n    font-weight: 700;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--acento-vivo);\n    border: 1px solid currentColor;\n    border-radius: 999px;\n    padding: 2px 10px;\n    white-space: nowrap;\n}\n\n.conta {\n    display: flex;\n    align-items: center;\n    margin-left: auto;\n    gap: 12px;\n    font-size: 0.85rem;\n    white-space: nowrap;\n}\n.conta strong { color: #fff; font-weight: 600; }\n.conta a { color: #fff; font-weight: 600; text-decoration: none; padding: 6px 12px; border: 1px solid #3b4a69; border-radius: var(--raio-pequeno); }\n.conta a:hover { border-color: #fff; color: #fff; }\n\n.gaveta-fundo {\n    position: fixed;\n    inset: 0;\n    background: rgba(10, 18, 36, 0.45);\n    opacity: 0;\n    visibility: hidden;\n    transition: opacity 0.2s, visibility 0.2s;\n    z-index: 40;\n}\n.gaveta {\n    position: fixed;\n    top: 0;\n    left: 0;\n    bottom: 0;\n    width: min(320px, 86vw);\n    background: var(--superficie);\n    box-shadow: 4px 0 24px rgba(10, 18, 36, 0.18);\n    transform: translateX(-100%);\n    visibility: hidden;\n    transition: transform 0.22s ease, visibility 0.22s;\n    z-index: 50;\n    display: flex;\n    flex-direction: column;\n    overflow-y: auto;\n}\nbody.gaveta-aberta .gaveta { transform: none; visibility: visible; }\nbody.gaveta-aberta .gaveta-fundo { opacity: 1; visibility: visible; }\n\n.gaveta-topo {\n    display: grid;\n    grid-template-columns: 44px minmax(0, 1fr) auto;\n    gap: 12px;\n    align-items: center;\n    padding: 18px 16px 18px 20px;\n    background: var(--noite);\n    color: #fff;\n    border-top: 4px solid var(--acento-vivo);\n}\n.gaveta-topo strong { display: block; font-size: 0.98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.gaveta-topo span:not(.avatar) { display: block; font-size: 0.78rem; color: var(--acento-vivo); font-weight: 600; }\n.avatar {\n    width: 44px; height: 44px; border-radius: 50%;\n    display: inline-flex; align-items: center; justify-content: center;\n    background: var(--acento); color: var(--acento-texto);\n    font-weight: 700; font-size: 1.1rem;\n}\n.gaveta .fechar {\n    width: 36px; height: 36px; padding: 0;\n    font-size: 1.5rem; line-height: 1;\n    color: #fff; background: transparent; border: 1px solid #3b4a69;\n}\n.gaveta .fechar:hover { background: #1d2c4d; color: #fff; border-color: #6a7a99; }\n\n.gaveta-itens { padding: 10px 0; flex: 1; }\n.gaveta-item, .gaveta-grupo summary {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 12px 20px;\n    color: var(--texto);\n    text-decoration: none;\n    font-weight: 600;\n    font-size: 0.95rem;\n    cursor: pointer;\n    border-left: 4px solid transparent;\n}\n.gaveta-item:hover, .gaveta-grupo summary:hover { background: #f4f7fb; color: var(--noite); }\n.gaveta-item.ativo { border-left-color: var(--acento); background: var(--acento-claro); color: var(--noite); }\n.gaveta-grupo summary { list-style: none; }\n.gaveta-grupo summary::-webkit-details-marker { display: none; }\n.gaveta-grupo .seta { color: var(--texto-suave); transition: transform 0.15s; }\n.gaveta-grupo[open] > summary .seta { transform: rotate(90deg); }\n.gaveta-sub .gaveta-item { padding: 10px 20px 10px 36px; font-weight: 500; font-size: 0.9rem; }\n.gaveta-sair {\n    margin: 0 20px 20px;\n    padding: 12px 0 0;\n    border-top: 1px solid var(--linha);\n    color: var(--perigo);\n    font-weight: 600;\n    text-decoration: none;\n}\n\n.area-layout {\n    display: grid;\n    grid-template-columns: 220px minmax(0, 1fr);\n    gap: 32px;\n    align-items: start;\n}\n.subnav {\n    position: sticky;\n    top: 20px;\n    background: var(--superficie);\n    border: 1px solid var(--linha);\n    border-radius: var(--raio);\n    padding: 16px 0;\n}\n.subnav-titulo {\n    padding: 0 18px 10px;\n    font-size: 0.75rem;\n    font-weight: 700;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--texto-suave);\n}\n.subnav nav a {\n    display: block;\n    padding: 10px 18px;\n    color: var(--texto);\n    text-decoration: none;\n    font-weight: 600;\n    font-size: 0.92rem;\n    border-left: 4px solid transparent;\n}\n.subnav nav a:hover { background: #f4f7fb; }\n.subnav nav a.ativo { border-left-color: var(--acento); background: var(--acento-claro); color: var(--noite); }\n.subnav .subnav-acao { margin: 14px 18px 0; width: calc(100% - 36px); }\n\n.trilha {\n    display: flex;\n    align-items: center;\n    gap: 6px;\n    font-size: 0.82rem;\n    color: var(--texto-suave);\n    margin-bottom: 8px;\n}\n.trilha span:last-child { color: var(--noite); font-weight: 600; }\n\n.area-conteudo .grade-2:not(.lado) { grid-template-columns: minmax(0, 1fr); }\n.area-conteudo .grade-2:not(.lado) > .caixa { max-width: 620px; }\n.area-conteudo .grade-2.invertida    \n    </aside>\n    <div class=\"area-conteudo\">\n        <p class=\"trilha\"><span>Minha energia</span><svg class=\"seta\" width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M5 3l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span>Unidades consumidoras</span></p>\n        <div class=\"cabecalho-pagina\">\n    <h2>Editar unidade UC-1001</h2>\n    <p>A troca de centro de distribuição só é permitida quando a unidade não tem ofertas abertas no marketplace.</p>\n</div>\n\n<section class=\"caixa estreita\">\n    <form method=\"POST\" action=\"/unidades/editar\">\n        <input type=\"hidden\" name=\"id\" value=\"1\">\n        <label for=\"numeroUc\">Número da UC</label>\n<input type=\"text\" id=\"numeroUc\" name=\"numeroUc\" value=\"UC-1001\" placeholder=\"ex: UC-1001\" required=\"\" minlength=\"3\" maxlength=\"30\">\n<label for=\"endereco\">Endereço</label>\n<input type=\"text\" id=\"endereco\" name=\"endereco\" value=\"Rua das Palmeiras, 120 - Maringá/PR\" placeholder=\"Rua, número, cidade\" required=\"\" minlength=\"5\" maxlength=\"200\">\n<label for=\"centroId\">Centro de distribuição</label>\n<select id=\"centroId\" name=\"centroId\"><option value=\"1\" selected=\"\">Centro de Distribuição Maringá Norte (Maringá/PR)</option><option value=\"2\">Centro de Distribuição Sarandi (Sarandi/PR)</option></select>\n<label for=\"capacidade\">Capacidade de geração instalada (kWp)</label>\n<input type=\"text\" id=\"capacidade\" name=\"capacidade\" value=\"5,4\" inputmode=\"decimal\" placeholder=\"ex: 5,4\">\n<p class=\"dica\">Deixe 0 se a unidade não tiver painéis solares.</p>\n\n        <div class=\"acoes-form\">\n            <button type=\"submit\">Salvar alterações</button>\n            <a class=\"botao botao-secundario\" href=\"/unidades\">Voltar sem salvar</a>\n        </div>\n    </form>\n</section>\n\n    </div>\n</div>\n\n</main>\n<footer class=\"rodape\">\n    <p>Projeto acadêmico ODS 9: marketplace de créditos de energia solar excedente (Lei 14.300/2022).</p>\n</footer>\n\n\n\n\n</body></html>"},{"titulo":"Unidade: exclusão bloqueada","nota":"Delete recusado com o motivo: a unidade tem oferta com venda registrada.","html":"<!DOCTYPE html><html lang=\"pt-BR\"><head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    <title>Unidades consumidoras | Marketplace de Energia Solar</title>\n    <style>:root {\n    --noite: #14213d;\n    --painel: #1f4e79;\n    --sol: #ffc233;\n    --sol-escuro: #e0a100;\n    --credito: #1e8a5b;\n    --credito-claro: #e6f4ed;\n    --fundo: #f2f5f9;\n    --superficie: #ffffff;\n    --linha: #d5dee8;\n    --texto: #1b2433;\n    --texto-suave: #5b6778;\n    --perigo: #b42318;\n    --perigo-claro: #fdecea;\n    --raio: 10px;\n    --raio-pequeno: 6px;\n    --sombra: 0 1px 2px rgba(20, 33, 61, 0.06), 0 4px 14px rgba(20, 33, 61, 0.05);\n    --fonte: \"Segoe UI Variable Text\", \"Segoe UI\", system-ui, -apple-system, \"Helvetica Neue\", Arial, sans-serif;\n    --acento: var(--sol);\n    --acento-hover: var(--sol-escuro);\n    --acento-texto: var(--noite);\n    --acento-claro: #fff4d1;\n    --acento-vivo: var(--sol);\n}\n\nbody.perfil-consumidor {\n    --acento: #2563eb;\n    --acento-hover: #1d4ed8;\n    --acento-texto: #ffffff;\n    --acento-claro: #e3ecfd;\n    --acento-vivo: #7fb2ff;\n}\n\nbody.perfil-ambos {\n    --acento: #15803d;\n    --acento-hover: #116632;\n    --acento-texto: #ffffff;\n    --acento-claro: #e2f4e8;\n    --acento-vivo: #5ee08c;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n    margin: 0;\n    min-height: 100vh;\n    display: flex;\n    flex-direction: column;\n    font-family: var(--fonte);\n    font-size: 15px;\n    line-height: 1.5;\n    color: var(--texto);\n    background: var(--fundo);\n}\n\na { color: var(--painel); text-underline-offset: 2px; }\na:hover { color: var(--noite); }\n\n:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }\n\nh1, h2, h3 { line-height: 1.25; margin: 0; color: var(--noite); }\nh2 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }\nh3 { font-size: 1.08rem; font-weight: 650; }\np { margin: 0; }\n\n.barra {\n    background: var(--noite);\n    color: #fff;\n    border-top: 4px solid var(--acento-vivo);\n}\n\n.barra-interna {\n    max-width: 1160px;\n    margin: 0 auto;\n    padding: 0 24px;\n    min-height: 60px;\n    display: flex;\n    align-items: center;\n    gap: 14px;\n}\n\n.hamburguer {\n    height: 38px;\n    padding: 0 12px 0 8px;\n    gap: 6px;\n    color: #fff;\n    background: transparent;\n    border: 1px solid #3b4a69;\n    font-size: 0.88rem;\n}\n.hamburguer:hover { background: #1d2c4d; border-color: #6a7a99; color: #fff; }\n\n.marca {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    color: #fff;\n    text-decoration: none;\n    font-weight: 700;\n    font-size: 1.02rem;\n    white-space: nowrap;\n}\n.marca:hover { color: #fff; }\n.marca svg { flex: none; }\n\n.area {\n    font-size: 0.72rem;\n    font-weight: 700;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--acento-vivo);\n    border: 1px solid currentColor;\n    border-radius: 999px;\n    padding: 2px 10px;\n    white-space: nowrap;\n}\n\n.conta {\n    display: flex;\n    align-items: center;\n    margin-left: auto;\n    gap: 12px;\n    font-size: 0.85rem;\n    white-space: nowrap;\n}\n.conta strong { color: #fff; font-weight: 600; }\n.conta a { color: #fff; font-weight: 600; text-decoration: none; padding: 6px 12px; border: 1px solid #3b4a69; border-radius: var(--raio-pequeno); }\n.conta a:hover { border-color: #fff; color: #fff; }\n\n.gaveta-fundo {\n    position: fixed;\n    inset: 0;\n    background: rgba(10, 18, 36, 0.45);\n    opacity: 0;\n    visibility: hidden;\n    transition: opacity 0.2s, visibility 0.2s;\n    z-index: 40;\n}\n.gaveta {\n    position: fixed;\n    top: 0;\n    left: 0;\n    bottom: 0;\n    width: min(320px, 86vw);\n    background: var(--superficie);\n    box-shadow: 4px 0 24px rgba(10, 18, 36, 0.18);\n    transform: translateX(-100%);\n    visibility: hidden;\n    transition: transform 0.22s ease, visibility 0.22s;\n    z-index: 50;\n    display: flex;\n    flex-direction: column;\n    overflow-y: auto;\n}\nbody.gaveta-aberta .gaveta { transform: none; visibility: visible; }\nbody.gaveta-aberta .gaveta-fundo { opacity: 1; visibility: visible; }\n\n.gaveta-topo {\n    display: grid;\n    grid-template-columns: 44px minmax(0, 1fr) auto;\n    gap: 12px;\n    align-items: center;\n    padding: 18px 16px 18px 20px;\n    background: var(--noite);\n    color: #fff;\n    border-top: 4px solid var(--acento-vivo);\n}\n.gaveta-topo strong { display: block; font-size: 0.98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.gaveta-topo span:not(.avatar) { display: block; font-size: 0.78rem; color: var(--acento-vivo); font-weight: 600; }\n.avatar {\n    width: 44px; height: 44px; border-radius: 50%;\n    display: inline-flex; align-items: center; justify-content: center;\n    background: var(--acento); color: var(--acento-texto);\n    font-weight: 700; font-size: 1.1rem;\n}\n.gaveta .fechar {\n    width: 36px; height: 36px; padding: 0;\n    font-size: 1.5rem; line-height: 1;\n    color: #fff; background: transparent; border: 1px solid #3b4a69;\n}\n.gaveta .fechar:hover { background: #1d2c4d; color: #fff; border-color: #6a7a99; }\n\n.gaveta-itens { padding: 10px 0; flex: 1; }\n.gaveta-item, .gaveta-grupo summary {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 12px 20px;\n    color: var(--texto);\n    text-decoration: none;\n    font-weight: 600;\n    font-size: 0.95rem;\n    cursor: pointer;\n    border-left: 4px solid transparent;\n}\n.gaveta-item:hover, .gaveta-grupo summary:hover { background: #f4f7fb; color: var(--noite); }\n.gaveta-item.ativo { border-left-color: var(--acento); background: var(--acento-claro); color: var(--noite); }\n.gaveta-grupo summary { list-style: none; }\n.gaveta-grupo summary::-webkit-details-marker { display: none; }\n.gaveta-grupo .seta { color: var(--texto-suave); transition: transform 0.15s; }\n.gaveta-grupo[open] > summary .seta { transform: rotate(90deg); }\n.gaveta-sub .gaveta-item { padding: 10px 20px 10px 36px; font-weight: 500; font-size: 0.9rem; }\n.gaveta-sair {\n    margin: 0 20px 20px;\n    padding: 12px 0 0;\n    border-top: 1px solid var(--linha);\n    color: var(--perigo);\n    font-weight: 600;\n    text-decoration: none;\n}\n\n.area-layout {\n    display: grid;\n    grid-template-columns: 220px minmax(0, 1fr);\n    gap: 32px;\n    align-items: start;\n}\n.subnav {\n    position: sticky;\n    top: 20px;\n    background: var(--superficie);\n    border: 1px solid var(--linha);\n    border-radius: var(--raio);\n    padding: 16px 0;\n}\n.subnav-titulo {\n    padding: 0 18px 10px;\n    font-size: 0.75rem;\n    font-weight: 700;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--texto-suave);\n}\n.subnav nav a {\n    display: block;\n    padding: 10px 18px;\n    color: var(--texto);\n    text-decoration: none;\n    font-weight: 600;\n    font-size: 0.92rem;\n    border-left: 4px solid transparent;\n}\n.subnav nav a:hover { background: #f4f7fb; }\n.subnav nav a.ativo { border-left-color: var(--acento); background: var(--acento-claro); color: var(--noite); }\n.subnav .subnav-acao { margin: 14px 18px 0; width: calc(100% - 36px); }\n\n.trilha {\n    display: flex;\n    align-items: center;\n    gap: 6px;\n    font-size: 0.82rem;\n    color: var(--texto-suave);\n    margin-bottom: 8px;\n}\n.trilha span:last-child { color: var(--noite); font-weight: 600; }\n\n.area-conteudo .grade-2:not(.lado) { grid-template-columns: minmax(0, 1fr); }\n.area-conteudo .grade-2:not(.lado) > .caixa { max-width: 620px; }\n.area-conteudo .grade-2.invertida > section:first-child { order: 0; }\n\n.conteudo {\n    flex: 1;\n    width: 100%;\n    max-width: 1160px;\n    margin: 0 auto;\n    padding: 32px 24px 48px;\n}\n\n.cabecalho-pagina { margin-bottom: 24px; }\n.cabecalho-pagina p { margin-top: 6px; color: var(--texto-suave); max-width: 68ch; }\n\n.secao { margin-top: 36px; }\n.secao-topo {\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-between;\n    gap: 16px;\n    flex-wrap: wrap;\n    margin-bottom: 14px;\n}\n.secao-topo p { color: var(--texto-suave); font-size: 0.9rem; margin-top: 2px; }\n\n.caixa {\n    background: var(--superficie);\n    border: 1px solid var(--linha);\n    border-radius: var(--raio);\n    padding: 24px;\n    min-width: 0;\n}\n.caixa > h3 { margin-bottom: 4px; }\n.caixa > .apoio { color: var(--texto-suave); font-size: 0.88rem; margin-bottom: 8px; }\n\n.grade-2 {\n    display: grid;\n    grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);\n    gap: 24px;\n    align-items: start;\n}\n.grade-2.invertida { grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr); }\n.grade-meia { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }\n\n.estreita { max-width: 560px; }\n\n.indicadores {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));\n    gap: 16px;\n}\n\n.indicador {\n    background: var(--superficie);\n    border: 1px solid var(--linha);\n    border-radius: var(--raio);\n    padding: 18px 20px;\n}\n.indicador .valor { display: block; font-size: 1.75rem; font-weight: 700; color: var(--noite); letter-spacing: -0.02em; }\n.indicador .valor small { font-size: 0.95rem; font-weight: 600; color: var(--texto-suave); margin-left: 3px; }\n.indicador .descricao { display: block; font-size: 0.85rem; color: var(--texto-suave); margin-top: 2px; }\n.indicador.destaque { background: var(--acento); border-color: var(--acento); }\n.indicador.destaque .valor, .indicador.des ass=\"gaveta-fundo\" data-fechar-menu=\"\"></div>\n<nav id=\"gaveta\" class=\"gaveta\" aria-label=\"Menu principal\">\n    <div class=\"gaveta-topo\">\n        <span class=\"avatar\" aria-hidden=\"true\">A</span>\n        <div><strong>Ana Souza</strong><span>Área do gerador</span></div>\n        <button type=\"button\" class=\"fechar\" data-fechar-menu=\"\" aria-label=\"Fechar menu\">×</button>\n    </div>\n    <div class=\"gaveta-itens\"><a class=\"gaveta-item\" href=\"/marketplace\">Início</a><details class=\"gaveta-grupo\">\n    <summary>Vendas<svg class=\"seta\" width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M5 3l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></summary>\n    <div class=\"gaveta-sub\"><a class=\"gaveta-item\" href=\"/vendas\">Resumo</a><a class=\"gaveta-item\" href=\"/vendas/ofertas\">Minhas ofertas</a><a class=\"gaveta-item\" href=\"/vendas/estoque\">Estoque de créditos</a></div>\n</details>\n<details class=\"gaveta-grupo\" open=\"\">\n    <summary>Minha energia<svg class=\"seta\" width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M5 3l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg></summary>\n    <div class=\"gaveta-sub\"><a class=\"gaveta-item ativo\" href=\"/unidades\" aria-current=\"page\">Unidades consumidoras</a><a class=\"gaveta-item\" href=\"/energia\">Registrar energia</a></div>\n</details>\n<a class=\"gaveta-item\" href=\"/relatorios\">Relatórios</a></div>\n    <a class=\"gaveta-sair\" href=\"/logout\">Sair</a>\n</nav>\n\n<main class=\"conteudo\">\n    <div class=\"area-layout\">\n    <aside class=\"subnav\" aria-label=\"Minha energia\">\n        <p class=\"subnav-titulo\">Minha energia</p>\n        <nav><a href=\"/unidades\" class=\"ativo\" aria-current=\"page\">Unidades consumidoras</a><a href=\"/energia\">Registrar energia</a></nav>\n        \n    </aside>\n    <div class=\"area-conteudo\">\n        <p class=\"trilha\"><span>Minha energia</span><svg class=\"seta\" width=\"14\" height=\"14\" viewBox=\"0 0 14 14\" aria-hidden=\"true\"><path d=\"M5 3l4 4-4 4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"></path></svg><span>Unidades consumidoras</span></p>\n        <div class=\"cabecalho-pagina\">\n    <h2>Minhas unidades consumidoras</h2>\n    <p>Cada unidade é um ponto de consumo da distribuidora. É nela que a geração é medida e o crédito é registrado.</p>\n</div>\n\n<div class=\"alerta alerta-erro\">A unidade UC-1001 não pode ser excluída: possui 1 oferta com vendas registradas no marketplace. O histórico de transações é um registro financeiro de compradores e vendedores e precisa ser preservado.</div>\n<div class=\"grade-2\">\n    <section><div class=\"tabela-envoltorio\"><table>\n    <thead><tr><th>Unidade</th><th>Centro de distribuição</th><th class=\"num\">Capacidade</th><th></th></tr></thead>\n    <tbody><tr>\n    <td><b>UC-1001</b><span class=\"secundario\">Rua das Palmeiras, 120 - Maringá/PR</span></td>\n    <td>Centro de Distribuição Maringá Norte</td>\n    <td class=\"num\">5,40 kWp</td>\n    <td><div class=\"acoes\">\n        <a class=\"botao botao-secundario pequeno\" href=\"/unidades/editar?id=1\">Editar</a>\n        <form method=\"POST\" action=\"/unidades/excluir\" onsubmit=\"return confirm('Excluir esta unidade? Os lançamentos de energia e os créditos dela também serão removidos.');\">\n            <input type=\"hidden\" name=\"id\" value=\"1\">\n            <button type=\"submit\" class=\"botao-perigo pequeno\">Excluir</button>\n        </form>\n    </div></td>\n</tr>\n</tbody>\n</table></div>\n<p class=\"dica\">Uma unidade com ofertas publicadas no marketplace só pode ser excluída depois que essas ofertas forem excluídas.\nSe alguma oferta já teve vendas, a unidade fica preservada como histórico financeiro.</p>\n</section>\n    <section class=\"caixa\">\n        <h3>Cadastrar unidade</h3>\n        <form method=\"POST\" action=\"/unidades\">\n            <label for=\"numeroUc\">Número da UC</label>\n<input type=\"text\" id=\"numeroUc\" name=\"numeroUc\" value=\"\" placeholder=\"ex: UC-1001\" required=\"\" minlength=\"3\" maxlength=\"30\">\n<label for=\"endereco\">Endereço</label>\n<input type=\"text\" id=\"endereco\" name=\"endereco\" value=\"\" placeholder=\"Rua, número, cidade\" required=\"\" minlength=\"5\" maxlength=\"200\">\n<label for=\"centroId\">Centro de distribuição</label>\n<select id=\"centroId\" name=\"centroId\"><option value=\"1\">Centro de Distribuição Maringá Norte (Maringá/PR)</option><option value=\"2\">Centro de Distribuição Sarandi (Sarandi/PR)</option></select>\n<label for=\"capacidade\">Capacidade de geração instalada (kWp)</label>\n<input type=\"text\" id=\"capacidade\" name=\"capacidade\" value=\"\" inputmode=\"decimal\" placeholder=\"ex: 5,4\">\n<p class=\"dica\">Deixe 0 se a unidade não tiver painéis solares.</p>\n\n            <button type=\"submit\">Cadastrar unidade</button>\n        </form>\n    </section>\n</div>\n\n    </div>\n</div>\n\n</main>\n<footer class=\"rodape\">\n    <p>Projeto acadêmico ODS 9: marketplace de créditos de energia solar excedente (Lei 14.300/2022).</p>\n</footer>\n\n\n\n\n</body></html>"},{"titulo":"Registrar energia (Ana)","nota":"O gerador lança geração e consumo; o excedente vira crédito de 60 meses.","html":"<!DOCTYPE html><html lang=\"pt-BR\"><head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    <title>Registrar energia | Marketplace de Energia Solar</title>\n    <style>:root {\n    --noite: #14213d;\n    --painel: #1f4e79;\n    --sol: #ffc233;\n    --sol-escuro: #e0a100;\n    --credito: #1e8a5b;\n    --credito-claro: #e6f4ed;\n    --fundo: #f2f5f9;\n    --superficie: #ffffff;\n    --linha: #d5dee8;\n    --texto: #1b2433;\n    --texto-suave: #5b6778;\n    --perigo: #b42318;\n    --perigo-claro: #fdecea;\n    --raio: 10px;\n    --raio-pequeno: 6px;\n    --sombra: 0 1px 2px rgba(20, 33, 61, 0.06), 0 4px 14px rgba(20, 33, 61, 0.05);\n    --fonte: \"Segoe UI Variable Text\", \"Segoe UI\", system-ui, -apple-system, \"Helvetica Neue\", Arial, sans-serif;\n    --acento: var(--sol);\n    --acento-hover: var(--sol-escuro);\n    --acento-texto: var(--noite);\n    --acento-claro: #fff4d1;\n    --acento-vivo: var(--sol);\n}\n\nbody.perfil-consumidor {\n    --acento: #2563eb;\n    --acento-hover: #1d4ed8;\n    --acento-texto: #ffffff;\n    --acento-claro: #e3ecfd;\n    --acento-vivo: #7fb2ff;\n}\n\nbody.perfil-ambos {\n    --acento: #15803d;\n    --acento-hover: #116632;\n    --acento-texto: #ffffff;\n    --acento-claro: #e2f4e8;\n    --acento-vivo: #5ee08c;\n}\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml { -webkit-text-size-adjust: 100%; }\n\nbody {\n    margin: 0;\n    min-height: 100vh;\n    display: flex;\n    flex-direction: column;\n    font-family: var(--fonte);\n    font-size: 15px;\n    line-height: 1.5;\n    color: var(--texto);\n    background: var(--fundo);\n}\n\na { color: var(--painel); text-underline-offset: 2px; }\na:hover { color: var(--noite); }\n\n:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }\n\nh1, h2, h3 { line-height: 1.25; margin: 0; color: var(--noite); }\nh2 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }\nh3 { font-size: 1.08rem; font-weight: 650; }\np { margin: 0; }\n\n.barra {\n    background: var(--noite);\n    color: #fff;\n    border-top: 4px solid var(--acento-vivo);\n}\n\n.barra-interna {\n    max-width: 1160px;\n    margin: 0 auto;\n    padding: 0 24px;\n    min-height: 60px;\n    display: flex;\n    align-items: center;\n    gap: 14px;\n}\n\n.hamburguer {\n    height: 38px;\n    padding: 0 12px 0 8px;\n    gap: 6px;\n    color: #fff;\n    background: transparent;\n    border: 1px solid #3b4a69;\n    font-size: 0.88rem;\n}\n.hamburguer:hover { background: #1d2c4d; border-color: #6a7a99; color: #fff; }\n\n.marca {\n    display: flex;\n    align-items: center;\n    gap: 10px;\n    color: #fff;\n    text-decoration: none;\n    font-weight: 700;\n    font-size: 1.02rem;\n    white-space: nowrap;\n}\n.marca:hover { color: #fff; }\n.marca svg { flex: none; }\n\n.area {\n    font-size: 0.72rem;\n    font-weight: 700;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--acento-vivo);\n    border: 1px solid currentColor;\n    border-radius: 999px;\n    padding: 2px 10px;\n    white-space: nowrap;\n}\n\n.conta {\n    display: flex;\n    align-items: center;\n    margin-left: auto;\n    gap: 12px;\n    font-size: 0.85rem;\n    white-space: nowrap;\n}\n.conta strong { color: #fff; font-weight: 600; }\n.conta a { color: #fff; font-weight: 600; text-decoration: none; padding: 6px 12px; border: 1px solid #3b4a69; border-radius: var(--raio-pequeno); }\n.conta a:hover { border-color: #fff; color: #fff; }\n\n.gaveta-fundo {\n    position: fixed;\n    inset: 0;\n    background: rgba(10, 18, 36, 0.45);\n    opacity: 0;\n    visibility: hidden;\n    transition: opacity 0.2s, visibility 0.2s;\n    z-index: 40;\n}\n.gaveta {\n    position: fixed;\n    top: 0;\n    left: 0;\n    bottom: 0;\n    width: min(320px, 86vw);\n    background: var(--superficie);\n    box-shadow: 4px 0 24px rgba(10, 18, 36, 0.18);\n    transform: translateX(-100%);\n    visibility: hidden;\n    transition: transform 0.22s ease, visibility 0.22s;\n    z-index: 50;\n    display: flex;\n    flex-direction: column;\n    overflow-y: auto;\n}\nbody.gaveta-aberta .gaveta { transform: none; visibility: visible; }\nbody.gaveta-aberta .gaveta-fundo { opacity: 1; visibility: visible; }\n\n.gaveta-topo {\n    display: grid;\n    grid-template-columns: 44px minmax(0, 1fr) auto;\n    gap: 12px;\n    align-items: center;\n    padding: 18px 16px 18px 20px;\n    background: var(--noite);\n    color: #fff;\n    border-top: 4px solid var(--acento-vivo);\n}\n.gaveta-topo strong { display: block; font-size: 0.98rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }\n.gaveta-topo span:not(.avatar) { display: block; font-size: 0.78rem; color: var(--acento-vivo); font-weight: 600; }\n.avatar {\n    width: 44px; height: 44px; border-radius: 50%;\n    display: inline-flex; align-items: center; justify-content: center;\n    background: var(--acento); color: var(--acento-texto);\n    font-weight: 700; font-size: 1.1rem;\n}\n.gaveta .fechar {\n    width: 36px; height: 36px; padding: 0;\n    font-size: 1.5rem; line-height: 1;\n    color: #fff; background: transparent; border: 1px solid #3b4a69;\n}\n.gaveta .fechar:hover { background: #1d2c4d; color: #fff; border-color: #6a7a99; }\n\n.gaveta-itens { padding: 10px 0; flex: 1; }\n.gaveta-item, .gaveta-grupo summary {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    padding: 12px 20px;\n    color: var(--texto);\n    text-decoration: none;\n    font-weight: 600;\n    font-size: 0.95rem;\n    cursor: pointer;\n    border-left: 4px solid transparent;\n}\n.gaveta-item:hover, .gaveta-grupo summary:hover { background: #f4f7fb; color: var(--noite); }\n.gaveta-item.ativo { border-left-color: var(--acento); background: var(--acento-claro); color: var(--noite); }\n.gaveta-grupo summary { list-style: none; }\n.gaveta-grupo summary::-webkit-details-marker { display: none; }\n.gaveta-grupo .seta { color: var(--texto-suave); transition: transform 0.15s; }\n.gaveta-grupo[open] > summary .seta { transform: rotate(90deg); }\n.gaveta-sub .gaveta-item { padding: 10px 20px 10px 36px; font-weight: 500; font-size: 0.9rem; }\n.gaveta-sair {\n    margin: 0 20px 20px;\n    padding: 12px 0 0;\n    border-top: 1px solid var(--linha);\n    color: var(--perigo);\n    font-weight: 600;\n    text-decoration: none;\n}\n\n.area-layout {\n    display: grid;\n    grid-template-columns: 220px minmax(0, 1fr);\n    gap: 32px;\n    align-items: start;\n}\n.subnav {\n    position: sticky;\n    top: 20px;\n    background: var(--superficie);\n    border: 1px solid var(--linha);\n    border-radius: var(--raio);\n    padding: 16px 0;\n}\n.subnav-titulo {\n    padding: 0 18px 10px;\n    font-size: 0.75rem;\n    font-weight: 700;\n    letter-spacing: 0.06em;\n    text-transform: uppercase;\n    color: var(--texto-suave);\n}\n.subnav nav a {\n    display: block;\n    padding: 10px 18px;\n    color: var(--texto);\n    text-decoration: none;\n    font-weight: 600;\n    font-size: 0.92rem;\n    border-left: 4px solid transparent;\n}\n.subnav nav a:hover { background: #f4f7fb; }\n.subnav nav a.ativo { border-left-color: var(--acento); background: var(--acento-claro); color: var(--noite); }\n.subnav .subnav-acao { margin: 14px 18px 0; width: calc(100% - 36px); }\n\n.trilha {\n    display: flex;\n    align-items: center;\n    gap: 6px;\n    font-size: 0.82rem;\n    color: var(--texto-suave);\n    margin-bottom: 8px;\n}\n.trilha span:last-child { color: var(--noite); font-weight: 600; }\n\n.area-conteudo .grade-2:not(.lado) { grid-template-columns: minmax(0, 1fr); }\n.area-conteudo .grade-2:not(.lado) > .caixa { max-width: 620px; }\n.area-conteudo .grade-2.invertida > section:first-child { order: 0; }\n\n.conteudo {\n    flex: 1;\n    width: 100%;\n    max-width: 1160px;\n    margin: 0 auto;\n    padding: 32px 24px 48px;\n}\n\n.cabecalho-pagina { margin-bottom: 24px; }\n.cabecalho-pagina p { margin-top: 6px; color: var(--texto-suave); max-width: 68ch; }\n\n.secao { margin-top: 36px; }\n.secao-topo {\n    display: flex;\n    align-items: flex-end;\n    justify-content: space-between;\n    gap: 16px;\n    flex-wrap: wrap;\n    margin-bottom: 14px;\n}\n.secao-topo p { color: var(--texto-suave); font-size: 0.9rem; margin-top: 2px; }\n\n.caixa {\n    background: var(--superficie);\n    border: 1px solid var(--linha);\n    border-radius: var(--raio);\n    padding: 24px;\n    min-width: 0;\n}\n.caixa > h3 { margin-bottom: 4px; }\n.caixa > .apoio { color: var(--texto-suave); font-size: 0.88rem; margin-bottom: 8px; }\n\n.grade-2 {\n    display: grid;\n    grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr);\n    gap: 24px;\n    align-items: start;\n}\n.grade-2.invertida { grid-template-columns: minmax(0, 1fr) minmax(0, 1.45fr); }\n.grade-meia { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start; }\n\n.estreita { max-width: 560px; }\n\n.indicadores {\n    display: grid;\n    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));\n    gap: 16px;\n}\n\n.indicador {\n    background: var(--superficie);\n    border: 1px solid var(--linha);\n    border-radius: var(--raio);\n    padding: 18px 20px;\n}\n.indicador .valor { display: block; font-size: 1.75rem; font-weight: 700; color: var(--noite); letter-spacing: -0.02em; }\n.indicador .valor small { font-size: 0.95rem; font-weight: 600; color: var(--texto-suave); margin-left: 3px; }\n.indicador .descricao { display: block; font-size: 0.85rem; color: var(--texto-suave); margin-top: 2px; }\n.indicador.destaque { background: var(--acento); border-color: var(--acento); }\n.indicador.destaque .valor, .indicador.destaque .valor small, .indicador.destaque .descricao { color: var(--acento-texto); }\n.indicador.destaque .descricao, .indicador.destaque .valor small { opacity: 0.85; }\n\nlabel {\n    display: block;\n    margin: 16px 0 6px;\n    font-weight: 600;\n    font-size: 0.86rem;\n    color: var(--texto);\n}\n\ninput, select {\n    display: block;\n    width: 100%;\n    min-width: 0;\n    height: 42px;\n    padding: 0 12px;\n    font: inherit;\n    font-size: 0.95rem;\n    color: var(--texto);\n    background: #fff;\n    border: 1px solid #b9c5d3;\n    border-radius: var(--raio-pequeno);\n}\nselect {\n    appearance: none;\n    -webkit-appearance: none;\n    padding-right: 36px;\n    text-overflow: ellipsis;\n    background-image: url(\"data:image/svg+xml,%3Csvg xmlns='ht id var(--linha);\n    border-radius: var(--raio);\n}\n.caixa .tabela-envoltorio { border-radius: var(--raio-pequeno); }\n\ntable { width: 100%; border-collapse: collapse; }\n\nth, td {\n    text-align: left;\n    padding: 12px 16px;\n    border-bottom: 1px solid var(--linha);\n    font-size: 0.9rem;\n    vertical-align: middle;\n}\nth {\n    font-size: 0.8rem;\n    font-weight: 650;\n    color: var(--texto-suave);\n    background: #f7f9fc;\n    white-space: nowrap;\n}\ntbody tr:last-child td { border-bottom: none; }\ntfoot td { background: #f7f9fc; font-weight: 700; border-top: 1px solid var(--linha); border-bottom: none; }\n\ntd.num, th.num { text-align: right; white-space: nowrap; }\ntd.positivo { color: var(--credito); font-weight: 650; }\ntd .secundario { display: block; font-size: 0.8rem; color: var(--texto-suave); }\n\n.acoes { display: flex; gap: 8px; align-items: center; justify-content: flex-end; flex-wrap: nowrap; }\n.acoes form { margin: 0; }\n\n.form-inline { display: flex; gap: 6px; align-items: center; margin: 0; }\n.form-inline input { width: 84px; height: 34px; }\n\n.acoes form > button[type=submit],\n.form-inline > button[type=submit],\n.linha-compra > button[type=submit] { margin-top: 0; }\n\ntd.num, .valor, .medidor, .saldo, .oferta-preco, .vitrine-resumo, tfoot td { font-variant-numeric: tabular-nums; }\n\n.alerta {\n    display: flex;\n    gap: 10px;\n    align-items: flex-start;\n    padding: 12px 16px;\n    margin: 0 0 20px;\n    border-radius: var(--raio-pequeno);\n    border: 1px solid;\n    font-size: 0.92rem;\n}\n.alerta::before {\n    flex: none;\n    width: 20px;\n    height: 20px;\n    border-radius: 50%;\n    display: inline-flex;\n    align-items: center;\n    justify-content: center;\n    font-size: 0.8rem;\n    font-weight: 700;\n    color: #fff;\n    margin-top: 1px;\n}\n.alerta-erro { background: var(--perigo-claro); color: #7a1a12; border-color: #f3c3bd; }\n.alerta-erro::before { content: \"!\"; background: var(--perigo); }\n.ale
